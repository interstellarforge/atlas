services:
  atlas:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - atlas-data:/data
    environment:
      # First start only: creates the initial admin when the database has no users.
      ATLAS_ADMIN_EMAIL: ${ATLAS_ADMIN_EMAIL:-}
      ATLAS_ADMIN_PASSWORD: ${ATLAS_ADMIN_PASSWORD:-}
      # Set to "false" when serving over plain HTTP (local use without a TLS proxy).
      ATLAS_COOKIE_SECURE: ${ATLAS_COOKIE_SECURE:-true}
    mem_limit: 384m
    restart: unless-stopped

volumes:
  atlas-data:
