services:
  atlas:
    # Release image; upgrade with `docker compose pull && docker compose up -d`. `up --build` builds from source instead.
    image: ghcr.io/interstellarforge/atlas:latest
    build:
      context: .
      args:
        VERSION: ${ATLAS_VERSION:-dev}
    ports:
      - "8080:8080"
    volumes:
      - atlas-data:/data
    environment:
      # First start only: creates the initial admin when the database has no users.
      ATLAS_ADMIN_EMAIL: ${ATLAS_ADMIN_EMAIL:-}
      ATLAS_ADMIN_PASSWORD: ${ATLAS_ADMIN_PASSWORD:-}
      # Set to "false" when serving over plain HTTP (local use without a TLS proxy).
      ATLAS_COOKIE_SECURE: ${ATLAS_COOKIE_SECURE:-true}
      # Optional outgoing email and the address used in its links; see docs/operations.md.
      ATLAS_REPO_ALLOW_PRIVATE: ${ATLAS_REPO_ALLOW_PRIVATE:-false}
      ATLAS_TRUSTED_PROXIES: ${ATLAS_TRUSTED_PROXIES:-}
      ATLAS_PUBLIC_URL: ${ATLAS_PUBLIC_URL:-}
      ATLAS_SMTP_HOST: ${ATLAS_SMTP_HOST:-}
      ATLAS_SMTP_PORT: ${ATLAS_SMTP_PORT:-587}
      ATLAS_SMTP_SECURITY: ${ATLAS_SMTP_SECURITY:-starttls}
      ATLAS_SMTP_USER: ${ATLAS_SMTP_USER:-}
      ATLAS_SMTP_PASSWORD: ${ATLAS_SMTP_PASSWORD:-}
      ATLAS_SMTP_FROM: ${ATLAS_SMTP_FROM:-}
      ATLAS_SMTP_FROM_NAME: ${ATLAS_SMTP_FROM_NAME:-Atlas}
    mem_limit: 384m
    restart: unless-stopped

volumes:
  atlas-data:
